<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#cbd5e1" stop-opacity="0.8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded squircle with subtle border -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.3"/>

  <!-- Holy Light Rays / Radial Glow -->
  <circle cx="32" cy="26" r="22" fill="url(#glow)"/>

  <!-- Celestial Sunbeam Rays -->
  <g stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round" opacity="0.6">
    <line x1="32" y1="6" x2="32" y2="11"/>
    <line x1="18" y1="12" x2="21" y2="16"/>
    <line x1="46" y1="12" x2="43" y2="16"/>
    <line x1="12" y1="26" x2="17" y2="26"/>
    <line x1="52" y1="26" x2="47" y2="26"/>
  </g>

  <!-- Central Radiant Cross -->
  <g filter="url(#softGlow)">
    <!-- Vertical Cross Beam -->
    <rect x="29" y="11" width="6" height="25" rx="2" fill="url(#goldGrad)"/>
    <!-- Horizontal Cross Beam -->
    <rect x="21" y="18" width="22" height="6" rx="2" fill="url(#goldGrad)"/>
    <!-- White Inner Core Highlight -->
    <rect x="30.5" y="12" width="3" height="23" rx="1.5" fill="#ffffff" opacity="0.9"/>
    <rect x="22.5" y="19.5" width="19" height="3" rx="1.5" fill="#ffffff" opacity="0.9"/>
  </g>

  <!-- Heavenly Clouds Bed at the Base -->
  <g fill="url(#cloudGrad)">
    <path d="M12 51 C12 47, 16 44, 21 44 C22.5 41, 26 39, 30 40 C33 38.5, 37 39.5, 39 42 C43 41.5, 47 44, 48 47 C52 47.5, 54 50, 52 53 C52 54, 12 54, 12 51 Z" opacity="0.9"/>
  </g>

  <!-- Open Scripture Bible at the Base of the Cross -->
  <g>
    <!-- Left Page -->
    <path d="M32 44 C26 42, 18 43, 15 45 C15 48.5, 15 51, 15 51 C18 49, 26 48, 32 50 Z" fill="#f8fafc" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Right Page -->
    <path d="M32 44 C38 42, 46 43, 49 45 C49 48.5, 49 51, 49 51 C46 49, 38 48, 32 50 Z" fill="#ffffff" stroke="#94a3b8" stroke-width="0.8"/>
    <!-- Spine Center -->
    <line x1="32" y1="44" x2="32" y2="50.5" stroke="#d97706" stroke-width="1.2"/>
    <!-- Scripture Text Lines -->
    <line x1="18" y1="46" x2="28" y2="45.2" stroke="#94a3b8" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="18" y1="48" x2="27" y2="47.3" stroke="#94a3b8" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="36" y1="45.2" x2="46" y2="46" stroke="#94a3b8" stroke-width="0.7" stroke-linecap="round"/>
    <line x1="37" y1="47.3" x2="46" y2="48" stroke="#94a3b8" stroke-width="0.7" stroke-linecap="round"/>
  </g>
</svg>